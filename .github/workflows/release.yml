# Cuts a release when a v* tag is pushed. Runs on a SELF-HOSTED Windows runner (label: clarion)
# because the exe needs Clarion 12 at C:\Clarion12 and MSBuild; a hosted runner cannot build it.
# tools\release.ps1 does the work; this file only checks out, calls it and publishes the output.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency: release-${{ github.ref_name }}
jobs:
  release:
    runs-on: [self-hosted, windows, clarion]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build, qualify and pack
        shell: powershell
        # TPSCLI_EXTRA, TPSCLI_EXPECTED and TPSCLI_TPSFIX_LOG are repository variables (Settings >
        # Secrets and variables > Actions > Variables) naming folders on the runner machine; without
        # them release.ps1 refuses to publish an unqualified build.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\release.ps1 -Version ${{ github.ref_name }} -Extra "${{ vars.TPSCLI_EXTRA }}" -Expected "${{ vars.TPSCLI_EXPECTED }}" -TpsFixLog "${{ vars.TPSCLI_TPSFIX_LOG }}"
      - name: Publish the GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} (Get-Item release\*.zip).FullName (Get-Item release\*.sha256).FullName --title "tpscli ${{ github.ref_name }}" --notes-file release\notes.md
