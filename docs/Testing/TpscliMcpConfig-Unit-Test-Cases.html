<style>

.chip.PASS{color:var(--ok);} .chip.FAIL{color:var(--bad);} .chip.BLOCKED{color:var(--amber);} .chip.NA{color:var(--label);}

</style></head><body><div class="wrap">
  <!-- >>> CUSTOMIZE: title + one-line subtitle <<< -->
  <h1>tpscli MCP server 0.1.0 — dtpos CONFIG files — Test Cases</h1>
  <p class="sub">The eight tools against the real dtpos 4.04 CONFIG folder, OPTIONS.TPS first; every write read back with a select · tick steps, record verdicts, print a PDF report.</p>
  <div id="loadNotice"></div>
  <div id="preamble"></div>
  <div id="runHeader"></div>
  <div id="dashboard"></div>
  <div id="cases"></div>
  <div id="report"></div>
  <div id="signoff"></div>
</div>
<script>
"use strict";

/* ============================ CUSTOMIZE START ============================ */
var SCHEMA_VERSION = "v1";          // bump ONLY on a breaking change to the CASES shape
var SUITE_ID = "tpscli-mcp-config-0-1-0";  // stable lowercase slug — keys localStorage
var STORAGE_KEY = "uts:" + SUITE_ID + ":" + SCHEMA_VERSION;
var SUITE_TITLE = "tpscli MCP server 0.1.0 — dtpos CONFIG files (OPTIONS.TPS)";   // heading on the printed report

// Sections drive the filter dropdown. One key per logical group of cases.
var SECTIONS = [
  {"key": "setup", "label": "Build and work copy"},
  {"key": "read", "label": "Reads on the real CONFIG folder (read-only server)"},
  {"key": "gate", "label": "Write gate on the real folder"},
  {"key": "write", "label": "Writes on the copy, each verified by a select"},
  {"key": "raw", "label": "Raw statements (tps_query) on the copy"}
];

// One object per test case. RULE: one source-numbered action = one steps[] entry = one checkbox.
// priority is "CORE" | "HIGH" | "MED". section must match a SECTIONS key.
var CASES = [
  {
      "id": "TC-01",
      "section": "setup",
      "priority": "CORE",
      "title": "Server is built and the exe is the one with the compressed-page fix",
      "pre": "Node 20 or later on PATH. Repository at branch feature/tpscli-mcp, commit 9aab623 or later (cli: DeRle stops at the page's uncompressed length). PowerShell open in the mcp folder (CP-1). ..\\cli\\tpscli.exe built from that commit.",
      "steps": [
          "Run: npm run build ; $LASTEXITCODE",
          "Run: node tools\\call.js tps_version",
          "Run: '{\"file\":\"OPTIONS.TPS\"}' | node tools\\call.js tps_describe --root $cfg  (CP-2; $cfg is set in CP-1)"
      ],
      "expected": "Step 1 prints nothing but 0. Step 2 prints server 0.1.0 and exe.version 0.1.0 with exe.ok true. Step 3 answers ok true (records 407). If step 3 instead answers DEFINITION_UNREADABLE 'bad RLE data in page at 1536; run TPSFix', the exe predates commit 9aab623: rebuild the CLI from cli\\ and record BLOCKED with the message until it is."
  },

  {
      "id": "TC-02",
      "section": "setup",
      "priority": "CORE",
      "title": "Fresh work copy of the CONFIG folder",
      "pre": "TC-01 passed. The real folder C:\\Projects\\GitLab\\POS\\dtpos_404_data\\CONFIG holds 64 .TPS files.",
      "steps": [
          "Run: New-Item -ItemType Directory -Force work\\config | Out-Null ; Copy-Item $cfg\\*.TPS work\\config\\ -Force  (CP-3)",
          "Run: (Get-ChildItem work\\config\\*.TPS).Count",
          "Run: node tools\\call.js tps_list_files --root work\\config"
      ],
      "expected": "Step 2 prints 64. Step 3 lists 64 files whose path starts with the mcp\\work\\config folder, among them OPTIONS.TPS with size 118016. If the count differs, the real folder has changed since this instrument was written: record the count in Notes and continue (later cases name their own expected values)."
  },

  {
      "id": "TC-03",
      "section": "read",
      "priority": "CORE",
      "title": "List the real CONFIG folder",
      "pre": "TC-01 passed. Nothing in this section starts the server with --allow-writes.",
      "steps": [
          "Run: node tools\\call.js tps_list_files --root $cfg",
          "Run: '{\"pattern\":\"OPT*\"}' | node tools\\call.js tps_list_files --root $cfg"
      ],
      "expected": "Step 1 lists 64 files with name, path (starting with $cfg), size and modified; the OPTIONS.TPS entry has size 118016. Step 2 lists exactly two entries, options.SCN and OPTIONS.TPS (the pattern is a file-name glob, not a .TPS filter, and is case-insensitive). No stderr call line appears for either step: tps_list_files never runs the exe."
  },

  {
      "id": "TC-04",
      "section": "read",
      "priority": "CORE",
      "title": "Describe OPTIONS.TPS",
      "pre": "TC-01 passed.",
      "steps": [
          "Run: '{\"file\":\"OPTIONS.TPS\"}' | node tools\\call.js tps_describe --root $cfg",
          "Read the columns and keys arrays."
      ],
      "expected": "ok true, op describe, file ending \\CONFIG\\OPTIONS.TPS, encrypted false, records 407. Seven columns, all STRING, in this order and size: CUSTOMER 32, MODULE 32, VARIABLE 32, VALUE 64, ENTRYPICTURE 20, DESCRIPTION 50, COMMENTS 1024. Two keys, neither primary: OPTKEY unique true, nocase true, components CUSTOMER, MODULE, VARIABLE (all asc); DESCRIPTKEY unique false, nocase true, components CUSTOMER, MODULE, DESCRIPTION. Stderr shows one line tpscli-mcp tps_describe <n>ms exit 0."
  },

  {
      "id": "TC-05",
      "section": "read",
      "priority": "CORE",
      "title": "Select option rows by module and by full key",
      "pre": "TC-04 passed.",
      "steps": [
          "Run: '{\"file\":\"OPTIONS.TPS\",\"columns\":[\"CUSTOMER\",\"VARIABLE\",\"VALUE\"],\"where\":\"MODULE = ''Tenders''\"}' | node tools\\call.js tps_select --root $cfg",
          "Run: '{\"file\":\"OPTIONS.TPS\",\"columns\":[\"VARIABLE\",\"VALUE\"],\"where\":\"CUSTOMER = ''DLT'' AND MODULE = ''BOPIS''\",\"order_by\":\"VARIABLE\"}' | node tools\\call.js tps_select --root $cfg",
          "Run: '{\"file\":\"OPTIONS.TPS\",\"columns\":[\"VALUE\"],\"where\":\"CUSTOMER = ''DLT'' AND MODULE = ''Tenders'' AND VARIABLE = ''QuickCashMode''\"}' | node tools\\call.js tps_select --root $cfg"
      ],
      "expected": "Step 1: row_count 6, truncated false; the rows are JDA/Accept All Manual Credit Cards/N, JDA/EBT Default Expiration/1249, DLT/EnableQuickCash/N, DLT/QuickCashMode/I, DLT/AmountOKThreshold/999.99, DLT/AmountOKCashBack/N. Step 2: row_count 6 in this order: CheckInterval 10, Enabled N, Path C:\\JDA\\BOPIS\\JSON, UnprocessedPath C:\\JDA\\BOPIS\\Unprocessed, ValidTypes 1,2,3, WarningThreshold 20. Step 3: exactly one row, [\"I\"]. Any other value in step 3 means the real folder has been changed since this instrument was written: record the value in Notes and FAIL only if steps 1 and 2 also differ."
  },

  {
      "id": "TC-06",
      "section": "read",
      "priority": "HIGH",
      "title": "Order, page and cap the 407 option rows, and read them as a table",
      "pre": "TC-04 passed.",
      "steps": [
          "Run: '{\"file\":\"OPTIONS.TPS\",\"columns\":[\"CUSTOMER\",\"MODULE\",\"VARIABLE\",\"VALUE\"],\"order_by\":\"CUSTOMER, MODULE, VARIABLE\",\"limit\":12}' | node tools\\call.js tps_select --root $cfg",
          "Run: '{\"file\":\"OPTIONS.TPS\",\"columns\":[\"CUSTOMER\",\"MODULE\",\"VARIABLE\",\"VALUE\"],\"order_by\":\"CUSTOMER, MODULE, VARIABLE\",\"limit\":12,\"offset\":12}' | node tools\\call.js tps_select --root $cfg",
          "Run: '{\"file\":\"OPTIONS.TPS\",\"columns\":[\"CUSTOMER\"],\"limit\":0}' | node tools\\call.js tps_select --root $cfg",
          "Run: '{\"file\":\"OPTIONS.TPS\",\"columns\":[\"CUSTOMER\",\"MODULE\",\"VARIABLE\"],\"order_by\":\"CUSTOMER, MODULE, VARIABLE\",\"limit\":3,\"format\":\"table\"}' | node tools\\call.js tps_select --root $cfg"
      ],
      "expected": "Step 1: row_count 12, truncated true, first row DLT, AssociateSale, DefaultAllowPurchase, Y. Step 2: row_count 12, truncated true, first row DLT, Device, Serial Secondary Scanner Port, COM7 and last row DLT, GiftCard, GiftCardType, 00950 (the 13th to 24th rows of the same order). Step 3: row_count 407, truncated false (limit 0 lifts the 1000-row default). Step 4 prints the text grid with header CUSTOMER MODULE VARIABLE, rows DLT AssociateSale DefaultAllowPurchase / DLT AssociateSale ReportDayofWeek / DLT BOPIS CheckInterval, and the last line (3 rows, truncated by LIMIT)."
  },

  {
      "id": "TC-07",
      "section": "read",
      "priority": "CORE",
      "title": "Every CONFIG file with compressed pages describes (regression for the DeRle fix)",
      "pre": "TC-01 passed. Before commit 9aab623 these ten files failed with DEFINITION_UNREADABLE 'bad RLE data in page at N; run TPSFix'.",
      "steps": [
          "Run: foreach ($n in 'CACODE','COMNDMST','CRPCMCFG','EODMNT','ERRORMSG','INCOMMCC','keybrdrv','OPTIONS','PMINTHDR','RPTDEF') { $r = \"{`\"file`\":`\"$n.TPS`\"}\" | node tools\\call.js tps_describe --root $cfg 2>$null | ConvertFrom-Json; \"$n ok=$($r.ok) records=$($r.records) cols=$($r.columns.Count)\" }",
          "Run: '{\"file\":\"SCRFIELD.TPS\"}' | node tools\\call.js tps_describe --root $cfg"
      ],
      "expected": "Step 1 prints ten lines, every one ok=True, with these records/cols: CACODE 107/7, COMNDMST 97/50, CRPCMCFG 42/4, EODMNT 133/10, ERRORMSG 247/3, INCOMMCC 56/8, keybrdrv 67/7, OPTIONS 407/7, PMINTHDR 137/8, RPTDEF 12/14. Any ok=False line: record FAIL and paste it into Notes. Step 2 is the documented limit, not a defect: ok false, DEFINITION_UNREADABLE, message 'File holds more than one table (1 and 17669); multi-table TPS files are not supported', exit 1."

function toggleStep(id, i, checked){ state.cases[id].steps[i] = checked; saveState(); afterChange(id); }

function setField(id, field, val){ state.cases[id][field] = val; saveState(); afterChange(id); }

var casesBound = false;

function completion(t){ return Math.round(((t.PASS+t.FAIL+t.BLOCKED+t.NA)/CASES.length)*100); }

function renderDashboard(){
  var secOpts = '<option value="all">All sections</option>'+
    '<option value="notrun">Not-run only</option><option value="failed">Failed only</option>'+
    SECTIONS.map(function(s){ return '<option value="sec:'+s.key+'">'+s.label+'</option>'; }).join("");
  document.getElementById("dashboard").innerHTML =
    '<div class="dash"><div id="counts"></div>'+
    '<div class="bar"><div id="barFill"></div></div>'+
    '<div class="dashctl">Filter: <select id="filter" onchange="applyFilter(this.value)">'+secOpts+'</select>'+
    '<button onclick="printReport()">Generate PDF Report</button>'+
    '<button onclick="newRun()">New Run / Clear All</button>'+
    '<button onclick="toggleAll()">Collapse / Expand</button></div></div>';
  recompute();
}
function recompute(){
  var t = tally(), el = document.getElementById("counts");
  if(el){
    el.innerHTML = '<b>Pass '+t.PASS+'</b> · Fail '+t.FAIL+' · Blocked '+t.BLOCKED+' · N/A '+t.NA+
      ' · Not-run '+t.NOTRUN+'  —  Pass-rate '+passRate(t)+'% (of Pass+Fail+Blocked) · Completion '+completion(t)+'%';
  }
  var bar = document.getElementById("barFill");
  if(bar) bar.style.width = completion(t) + "%";
}
function applyFilter(f){
  activeFilter = f;
  CASES.forEach(function(c){
    var card = document.getElementById("case_"+c.id); if(!card) return;
    var v = state.cases[c.id].verdict;
    var show = (f==="all") || (f==="notrun" && !v) || (f==="failed" && v==="FAIL") ||
      (f.indexOf("sec:")===0 && c.section===f.slice(4));
    card.style.display = show ? "" : "none";
  });
}

function renderLoadNotice(){
  var el = document.getElementById("loadNotice");
  if(loadError){
    el.innerHTML = '<div class="notice">Saved data for this run could not be read. Auto-save is paused to avoid destroying it. '+
      '<button onclick="startFreshAfterError()">Start a fresh run (clears it)</button></div>';
  } else { el.innerHTML = ""; }
}
function startFreshAfterError(){
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  loadError = false; state = freshState(); renderAll();
}

var allCollapsed = false;
function toggleAll(){
  allCollapsed = !allCollapsed;
  document.querySelectorAll(".case .body-collapsible").forEach(function(b){ b.style.display = allCollapsed ? "none" : ""; });
}

function printReport(){ flushState(); buildReport(); window.print(); }

function newRun(){
  if(!window.confirm("Start a NEW run? This clears the current run's verdicts, notes, and header. Print the PDF first if you need the current results.")) return;
  try { localStorage.removeItem(STORAGE_KEY); localStorage.setItem(SEED_OPTOUT_KEY, "1"); } catch(e){}
  loadError = false; state = freshState(); state.resumed = false; renderAll();
}

function verdictLabel(v){ return v || "Not run"; }

function badgeCell(v){
  var map = {PASS:["pass","PASS"],FAIL:["fail","FAIL"],BLOCKED:["blk","BLOCKED"],NA:["na","N/A"]};
  var m = map[v] || ["na","NOT RUN"];
  return '<span class="rpt-badge '+m[0]+'">'+m[1]+'</span>';
}
function clearedToMerge(){   // cleared = every CORE and HIGH case is PASS
  return CASES.every(function(c){
    return !(c.priority==="CORE"||c.priority==="HIGH") || state.cases[c.id].verdict==="PASS";
  });
}
function genStamp(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

function buildReport(){
  var t = tally(), h = state.header;

  var meta = '<tr><td>Feature</td><td>'+esc(SUITE_TITLE)+'</td></tr>';
  meta += HEADER_FIELDS.map(function(f){ return '<tr><td>'+f[1]+'</td><td>'+esc(h[f[0]]||"—")+'</td></tr>'; }).join("");
  meta += '<tr><td>Report generated</td><td>'+genStamp()+'</td></tr>';

  var blockers = CASES.filter(function(c){
    return (c.priority==="CORE"||c.priority==="HIGH") && state.cases[c.id].verdict!=="PASS";
  });
  var verdict;
  if(clearedToMerge()){
    verdict = '<div class="rpt-verdict pass"><div class="rpt-vtitle">PASS &mdash; cleared to merge</div>'+
      '<p>All CORE and HIGH priority cases passed.</p></div>';
  } else {
    var bl = blockers.map(function(c){ return c.id+' ('+verdictLabel(state.cases[c.id].verdict)+')'; }).join(', ');
    verdict = '<div class="rpt-verdict fail"><div class="rpt-vtitle">NOT CLEARED &mdash; '+blockers.length+' CORE/HIGH case(s) outstanding</div>'+
      '<p>Resolve before merge: '+esc(bl)+'.</p></div>';
  }

  var tiles = '<div class="rpt-tiles">'+
    '<div class="tile pass"><b>'+t.PASS+'</b><span>PASS</span></div>'+
    '<div class="tile fail"><b>'+t.FAIL+'</b><span>FAIL</span></div>'+
    '<div class="tile blk"><b>'+t.BLOCKED+'</b><span>BLOCKED</span></div>'+
    '<div class="tile na"><b>'+t.NA+'</b><span>N/A</span></div>'+
    '<div class="tile nr"><b>'+t.NOTRUN+'</b><span>NOT RUN</span></div></div>';

  var rows = CASES.map(function(c){
    var st = state.cases[c.id];
    var note = esc(st.notes);
    if(st.evidence.trim()) note += (note?' &middot; ':'')+'<i>Ev:</i> '+esc(st.evidence);
    return '<tr><td>'+c.id+'</td><td>'+c.priority+'</td><td>'+badgeCell(st.verdict)+'</td>'+
      '<td>'+esc(c.title)+'</td><td>'+(note||'—')+'</td></tr>';
  }).join("");

  var sign = SIGN_ROLES.map(function(r){
    var s = state.signoff[r[0]];
    return '<tr><td>'+r[1]+'</td><td>'+(esc(s.name)||"—")+' &middot; '+(esc(s.date)||"—")+' &middot; '+(esc(s.result)||"—")+'</td></tr>';
  }).join("");

  document.getElementById("report").innerHTML =
    '<div class="rpt">'+
      '<header class="rpt-hd"><div class="rpt-logo">'+RPT_LOGO+'</div>'+
        '<h1>'+esc(SUITE_TITLE)+' &mdash; Test Completion Report</h1>'+

      '<table class="rpt-meta">'+meta+'</table>'+
