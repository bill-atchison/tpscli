var loadError = false, storageOK = true, saveTimer = null;

function timeNow(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}

function loadState(){
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ storageOK = false; }
  var seed = (typeof SEED_STATE !== "undefined" && SEED_STATE) ? SEED_STATE : null;
  if(!raw) return (seed && !seedOptedOut()) ? hydrate(seed) : freshState();
  var s;
  try { s = JSON.parse(raw); }
  catch(e){ loadError = true; return freshState(); }   // unparseable — don't wipe; show notice
  // A saved run nobody touched (the page saves on close even when untouched) defers to the
  // embedded run, unless New Run was used, which records that choice under SEED_OPTOUT_KEY.
  if(seed && isUntouched(s) && !seedOptedOut()) return hydrate(seed);
  return hydrate(s);
}
var SEED_OPTOUT_KEY = STORAGE_KEY + ":noseed";
function seedOptedOut(){ try { return !!localStorage.getItem(SEED_OPTOUT_KEY); } catch(e){ return false; } }
function isUntouched(s){
  if(!s || typeof s !== "object") return true;
  var h = s.header || {}, touched = Object.keys(h).some(function(k){ return !!h[k]; });
  var c = s.cases || {};
  Object.keys(c).forEach(function(id){
    var x = c[id] || {};
    if(x.verdict || x.notes || x.evidence || (Array.isArray(x.steps) && x.steps.some(Boolean))) touched = true;
  });
  return !touched;
}

// Merge valid values over a fresh skeleton so a drifted/partial save never throws at render.
function hydrate(s){
  var fresh = freshState();
  if(!s || typeof s !== "object"){ loadError = true; return fresh; }
  if(s.header && typeof s.header === "object"){
    Object.keys(fresh.header).forEach(function(k){
      if(typeof s.header[k] === "string") fresh.header[k] = s.header[k];
    });
  }
  if(s.signoff && typeof s.signoff === "object"){
    Object.keys(fresh.signoff).forEach(function(role){
      var src = s.signoff[role]; if(!src) return;
      ["name","date","result"].forEach(function(fld){
        if(typeof src[fld] === "string") fresh.signoff[role][fld] = src[fld];
      });
    });
  }
  if(s.cases && typeof s.cases === "object"){
    CASES.forEach(function(c){
      var src = s.cases[c.id]; if(!src) return;
      var dst = fresh.cases[c.id];
      if(["PASS","FAIL","BLOCKED","NA",""].indexOf(src.verdict) !== -1) dst.verdict = src.verdict;
      if(typeof src.notes === "string") dst.notes = src.notes;
      if(typeof src.evidence === "string") dst.evidence = src.evidence;
      if(Array.isArray(src.steps) && src.steps.length === dst.steps.length){
        dst.steps = src.steps.map(function(b){ return !!b; });
      }
    });
  }
  fresh.resumed = true;
  return fresh;
}

function flushState(){
  if(loadError) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageOK = true; setSaveStatus("Saved " + timeNow()); }
  catch(e){ storageOK = false; setSaveStatus("Not saving — print before you close"); }
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var VERDICTS = ["PASS","FAIL","BLOCKED","NA"];

function toggleStep(id, i, checked){ state.cases[id].steps[i] = checked; saveState(); afterChange(id); }

function renderCase(c){
  var st = state.cases[c.id];

    var ck = st.steps[i] ? " checked" : "";

  }).join("");
  var verdictHtml = VERDICTS.map(function(v){
    var ck = (st.verdict===v) ? " checked" : "";

  }).join("");
  return '<div class="case" id="case_'+c.id+'" data-section="'+c.section+'">'+
     '<h3>'+c.id+' — '+esc(c.title)+'<span class="pill '+c.priority+'">'+c.priority+'</span>'+

var casesBound = false;

    var el = e.target, id = el.getAttribute("data-id"); if(!id) return;

function stepStats(id){

function caseFlags(id){
  var c = state.cases[id], s = stepStats(id), flags = [];

function updateFlags(id){

function applyFilter(f){

    var v = state.cases[c.id].verdict;

      (f.indexOf("sec:")===0 && c.section===f.slice(4));

}

function renderLoadNotice(){

function startFreshAfterError(){

}

var allCollapsed = false;
function toggleAll(){

function newRun(){

}

function badgeCell(v){
  var map = {PASS:["pass","PASS"],FAIL:["fail","FAIL"],BLOCKED:["blk","BLOCKED"],NA:["na","N/A"]};
  var m = map[v] || ["na","NOT RUN"];
  return '<span class="rpt-badge '+m[0]+'">'+m[1]+'</span>';
}
function clearedToMerge(){   // cleared = every CORE and HIGH case is PASS
  return CASES.every(function(c){
    return !(c.priority==="CORE"||c.priority==="HIGH") || state.cases[c.id].verdict==="PASS";
  });
}
function genStamp(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

function buildReport(){
  var t = tally(), h = state.header;

  var meta = '<tr><td>Feature</td><td>'+esc(SUITE_TITLE)+'</td></tr>';
  meta += HEADER_FIELDS.map(function(f){ return '<tr><td>'+f[1]+'</td><td>'+esc(h[f[0]]||"—")+'</td></tr>'; }).join("");
  meta += '<tr><td>Report generated</td><td>'+genStamp()+'</td></tr>';

  var blockers = CASES.filter(function(c){
    return (c.priority==="CORE"||c.priority==="HIGH") && state.cases[c.id].verdict!=="PASS";
  });
  var verdict;
  if(clearedToMerge()){
    verdict = '<div class="rpt-verdict pass"><div class="rpt-vtitle">PASS &mdash; cleared to merge</div>'+
      '<p>All CORE and HIGH priority cases passed.</p></div>';
  } else {
    var bl = blockers.map(function(c){ return c.id+' ('+verdictLabel(state.cases[c.id].verdict)+')'; }).join(', ');
    verdict = '<div class="rpt-verdict fail"><div class="rpt-vtitle">NOT CLEARED &mdash; '+blockers.length+' CORE/HIGH case(s) outstanding</div>'+
      '<p>Resolve before merge: '+esc(bl)+'.</p></div>';
  }

  var tiles = '<div class="rpt-tiles">'+
    '<div class="tile pass"><b>'+t.PASS+'</b><span>PASS</span></div>'+
    '<div class="tile fail"><b>'+t.FAIL+'</b><span>FAIL</span></div>'+
    '<div class="tile blk"><b>'+t.BLOCKED+'</b><span>BLOCKED</span></div>'+
    '<div class="tile na"><b>'+t.NA+'</b><span>N/A</span></div>'+
    '<div class="tile nr"><b>'+t.NOTRUN+'</b><span>NOT RUN</span></div></div>';

  var rows = CASES.map(function(c){
    var st = state.cases[c.id];
    var note = esc(st.notes);
    if(st.evidence.trim()) note += '<span class="ev">'+esc(st.evidence)+'</span>';
    return '<tr><td>'+c.id+'</td><td>'+c.priority+'</td><td>'+badgeCell(st.verdict)+'</td>'+
      '<td>'+esc(c.title)+'</td><td>'+(note||'—')+'</td></tr>';
  }).join("");

  var sign = SIGN_ROLES.map(function(r){
    var s = state.signoff[r[0]];
    return '<tr><td>'+r[1]+'</td><td>'+(esc(s.name)||"—")+' &middot; '+(esc(s.date)||"—")+' &middot; '+(esc(s.result)||"—")+'</td></tr>';
  }).join("");

  document.getElementById("report").innerHTML =
    '<div class="rpt">'+
      '<header class="rpt-hd"><div class="rpt-logo">'+RPT_LOGO+'</div>'+
        '<h1>'+esc(SUITE_TITLE)+' &mdash; Test Completion Report</h1>'+
        '<p class="rpt-sub">Test results &mdash; a dated, signed completion report.</p></header>'+
      '<table class="rpt-meta">'+meta+'</table>'+
      verdict + tiles +
      '<h2 class="rpt-h2">Results detail</h2>'+
      '<table class="rpt-tbl"><tr><th>Case</th><th>Priority</th><th>Result</th><th>Title</th><th>Notes</th></tr>'+rows+'</table>'+
      '<h2 class="rpt-h2">Sign-off</h2>'+
      '<table class="rpt-sign">'+sign+'</table>'+
      '<p class="rpt-foot">Dollar Tree &middot; '+esc(SUITE_TITLE)+'. Test cases mirror the QA Testing Guide (single source of truth). Self-contained; results stored only in this browser until you print or export.</p>'+
    '</div>';
}

function renderAll(){
  bindCaseDelegation(); bindSignDelegation();
  renderPreamble(); renderLoadNotice(); renderHeader(); renderSignoff();

renderAll();
